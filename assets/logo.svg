<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Comet"><defs>
<linearGradient id="bg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse"><stop stop-color="#1C1C1F"/><stop offset="1" stop-color="#050506"/></linearGradient>
<!-- Every circle touches the comet's head at its top right: each white ring is a circle less the black one inside it. -->
<mask id="rings" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
<circle cx="512.0" cy="512.0" r="270" fill="#fff"/><circle cx="526.1" cy="497.9" r="250" fill="#000"/>
<circle cx="564.3" cy="459.7" r="196" fill="#fff"/><circle cx="575.6" cy="448.4" r="180" fill="#000"/>
<circle cx="611.0" cy="413.0" r="130" fill="#fff"/><circle cx="620.2" cy="403.8" r="117" fill="#000"/>
<circle cx="652.0" cy="372.0" r="72" fill="#fff"/></mask></defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
<rect width="1024" height="1024" fill="#F5F5F2" mask="url(#rings)"/>
</svg>
