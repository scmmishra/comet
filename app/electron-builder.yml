# Builds Desk.app from the app's electron-vite output. scripts/package.sh then adds the core and Bun.
appId: app.desk
productName: Desk
directories:
  output: ../dist
  buildResources: build
# electron-vite bundles everything the app runs into out/, so the app's packages stay behind.
files:
  - out/**
  - package.json
  - "!node_modules/**"
npmRebuild: false
mac:
  target: dir
  # Gives macOS 26 a light and a dark icon. electron-builder renders an .icns from it for older macOS.
  icon: build/Desk.icon
  category: public.app-category.developer-tools
  # Signed ad hoc after packaging: Desk is built for this Mac, not distributed.
  identity: null
