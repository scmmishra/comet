[tools]
bun = "1.4.4"

[tasks.dev]
description = "Run Desk in development"
run = "bun run --cwd app dev"

[tasks.check]
description = "Typecheck, test and build"
run = "bun run typecheck && bun test core app/src && bun run --cwd app build"

[tasks.package]
description = "Build Desk.app in dist/mac-arm64"
run = "scripts/package.sh"

[tasks.install]
description = "Build Desk.app and install it in /Applications, or update the running Desk"
run = "scripts/install.sh"

[tasks.icons]
description = "Render assets/logo.svg into the app's icons"
run = "scripts/icons.sh"

[tasks."native:dev"]
description = "Run the native Desk, built with Rune, in development"
run = "cargo run --manifest-path native/Cargo.toml"

[tasks."native:test"]
description = "Test the native Desk"
run = "cargo test --manifest-path native/Cargo.toml"
