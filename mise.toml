[tools]
bun = "1.4.4"

[tasks.dev]
description = "Run Desk in development, from the repo"
run = "cargo run --manifest-path native/Cargo.toml"

[tasks.test]
description = "Test the core and the native Desk"
run = "bun test core && cargo test --manifest-path native/Cargo.toml"

[tasks.check]
description = "Typecheck, lint, test and build"
run = "bun run typecheck && bun test core app/src && cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings && cargo test --manifest-path native/Cargo.toml && bun run --cwd app build"

[tasks.package]
description = "Build Desk.app in dist/mac-arm64"
run = "scripts/package.sh"

[tasks.install]
description = "Build Desk.app and install it in /Applications, or update the running Desk"
run = "scripts/install.sh"

[tasks.icons]
description = "Render assets/logo.svg into the app's icons"
run = "scripts/icons.sh"

[tasks."electron:dev"]
description = "Run the Electron Desk Dev, which Desk replaces"
run = "bun run --cwd app dev"

[tasks."electron:package"]
description = "Build the Electron Desk.app in dist/electron"
run = "scripts/package-electron.sh"
