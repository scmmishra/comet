[package]
name = "desk"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# Rune is pre-release. Apps pin a rev of its `dev` branch, which is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1", features = ["native-file-dialog", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
alacritty_terminal = "0.26"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

# Rune builds against its own copies of these crates, and a dependency's `[patch]` does not reach
# Desk. Without them Desk builds against the stock crates and loses Rune's input method, text
# shaping and VoiceOver heading fixes. The list follows the `[patch.crates-io]` table in Rune's root
# `Cargo.toml`, at the same rev as above.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }

# Rune's own profiles. Full debug info for Rune made one test build take tens of GB of memory.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
