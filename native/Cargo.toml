[package]
name = "desk"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# Rune is pre-release. Apps pin a rev of its `dev` branch, which is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "db69ea31ab9333e6f368649d4d019311720a98eb", features = ["native-file-dialog", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "db69ea31ab9333e6f368649d4d019311720a98eb", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "db69ea31ab9333e6f368649d4d019311720a98eb" }
alacritty_terminal = "0.26"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

# Rune's own profiles. Full debug info for Rune made one test build take tens of GB of memory.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
