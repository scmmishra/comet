[package]
name = "comet"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
# Rune is pre-release. Apps pin a rev of its `dev` branch, which is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "4699d649ebd5754dbf35494ed8d0f636a84cf19d", features = ["native-file-dialog", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "4699d649ebd5754dbf35494ed8d0f636a84cf19d", features = ["markdown", "mermaid"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "4699d649ebd5754dbf35494ed8d0f636a84cf19d" }
alacritty_terminal = "0.26"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

# Rune builds against its own copies of these crates, and a dependency's `[patch]` does not reach
# Comet. Without them Comet builds against the stock crates and loses Rune's input method, text
# shaping, shader and VoiceOver heading fixes. Without Rune's naga, the WGSL overrides in Rune's
# shaders, such as `layer_blur.wgsl`'s, can fail to compile. Rune's winit also needs Rune's
# sctk-adwaita. `accesskit_atspi_common` is for Linux only. The list follows the
# `[patch.crates-io]` table in Rune's root `Cargo.toml`, at the same rev as above.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "4699d649ebd5754dbf35494ed8d0f636a84cf19d" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "4699d649ebd5754dbf35494ed8d0f636a84cf19d" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "4699d649ebd5754dbf35494ed8d0f636a84cf19d" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "4699d649ebd5754dbf35494ed8d0f636a84cf19d" }
naga = { git = "https://github.com/anomalyco/rune", rev = "4699d649ebd5754dbf35494ed8d0f636a84cf19d" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "4699d649ebd5754dbf35494ed8d0f636a84cf19d" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "4699d649ebd5754dbf35494ed8d0f636a84cf19d" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "4699d649ebd5754dbf35494ed8d0f636a84cf19d" }

# Rune's own profiles. Full debug info for Rune made one test build take tens of GB of memory.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
