[package]
name = "desk"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Rune is pre-release. Apps pin a rev of its `dev` branch, which is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "257f5599c8e499bb7dfd7ee03f57a9932724244a" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "257f5599c8e499bb7dfd7ee03f57a9932724244a" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "257f5599c8e499bb7dfd7ee03f57a9932724244a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

# Rune's own profiles. Full debug info for Rune made one test build take tens of GB of memory.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
